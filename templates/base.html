<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Catalog Risk Scanner{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen">
    <header class="border-b bg-white">
        <div class="max-w-6xl mx-auto px-6 py-4 flex items-center justify-between">
            <div>
                <h1 class="text-xl font-bold">Catalog Risk Scanner</h1>
                <p class="text-sm text-slate-500">Catch listing risks before they become problems.</p>
            </div>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-6 py-10">
        {% block content %}{% endblock %}
    </main>
<footer class="border-t bg-white mt-16">
    <div class="max-w-6xl mx-auto px-6 py-6 text-sm text-slate-500">
        Catalog Risk Scanner MVP · Built to catch listing issues before publishing
    </div>
</footer>
</body>
</html>
